services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: campus_agent
      POSTGRES_USER: campus_agent
      POSTGRES_PASSWORD: campus_agent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus_agent -d campus_agent"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql+psycopg://campus_agent:campus_agent@db:5432/campus_agent}
      LOCAL_STORAGE_ROOT: ${LOCAL_STORAGE_ROOT:-/data/storage}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      CHAT_BASE_URL: ${CHAT_BASE_URL:-}
      CHAT_API_KEY: ${CHAT_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/data/storage

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  postgres_data:
